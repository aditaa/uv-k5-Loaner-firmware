name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      SOURCE_COMMIT: ${{ github.sha }}

    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Load validated firmware suffix
        run: |
          SUFFIX="$(tr -d '\r\n' < VERSION_SUFFIX)"
          python3 ci/release_artifacts.py validate-suffix "${SUFFIX}"
          echo "VERSION_SUFFIX=${SUFFIX}" >> "${GITHUB_ENV}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          languages: ${{ matrix.language }}

      - name: Install verified ARM GCC toolchain
        run: bash ci/install-arm-toolchain.sh "${RUNNER_TEMP}"

      - name: Build firmware
        run: make -j"$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
